<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latince Öğreniyorum</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <header>
        <div class="header-content">
            <h1><i class="fas fa-landmark"></i> Latince Öğreniyorum</h1>
            <p>Antik Roma'nın Kadim Bilgeliği ve Deyimleri</p>
            
            <div class="search-box">
                <i class="fas fa-search"></i>
                <input type="text" id="searchInput" placeholder="Latince bir deyiş veya Türkçe bir kelime ara...">
            </div>
        </div>
    </header>

    <main class="container">
        <div class="stats">
            <p>Toplam <span id="countDisplay">0</span> deyim listeleniyor.</p>
        </div>
        
        <div id="phraseList" class="phrase-grid">
            <!-- Kartlar JavaScript ile buraya eklenecek -->
        </div>
    </main>

    <footer>
        <p>Latince Öğreniyorum Sözlüğü & Arşivi</p>
    </footer>

    <script src="app.js"></script>
</body>
</html>
