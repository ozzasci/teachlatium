<!DOCTYPE html>
<html lang="tr" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latince Öğreniyorum | Etkileşimli Sözlük</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <header>
        <div class="header-controls">
            <button id="themeToggle" class="icon-btn" title="Gece/Gündüz Modu">
                <i class="fas fa-moon"></i>
            </button>
        </div>
        
        <div class="header-content">
            <h1><i class="fas fa-landmark"></i> Latince Öğreniyorum</h1>
            <p>Antik Roma'nın Kadim Bilgeliği ve Deyimleri</p>
            
            <div class="search-box">
                <i class="fas fa-search"></i>
                <input type="text" id="searchInput" placeholder="Latince bir deyiş veya Türkçe bir kelime ara...">
            </div>
            
            <!-- Kategori ve Filtreleme Butonları -->
            <div class="filter-container">
                <button class="filter-btn active" data-filter="all">Tümü</button>
                <button class="filter-btn" data-filter="favorites"><i class="fas fa-heart"></i> Favorilerim</button>
                <button class="filter-btn" data-filter="tarih">Tarih</button>
                <button class="filter-btn" data-filter="hukuk">Hukuk</button>
                <button class="filter-btn" data-filter="felsefe">Felsefe</button>
            </div>
        </div>
    </header>

    <main class="container">
        <div class="stats">
            <p>Toplam <span id="countDisplay">0</span> deyim listeleniyor.</p>
        </div>
        
        <!-- Flashcard'ların yükleneceği alan -->
        <div id="phraseList" class="phrase-grid">
            <!-- Örnek bir Flashcard (JS ile otomatik üretilecek yapı) -->
            <!--
            <div class="phrase-card">
                <div class="card-inner">
                    <div class="card-front">
                        <button class="fav-btn"><i class="far fa-heart"></i></button>
                        <span class="category-tag">Tarih</span>
                        <div class="latin-text">Alea iacta est</div>
                        <div class="hint-text">Anlamını görmek için tıkla</div>
                    </div>
                    <div class="card-back">
                        <button class="fav-btn"><i class="far fa-heart"></i></button>
                        <div class="turkish-text">Zar atıldı</div>
                        <div class="history-note">
                            <i class="fas fa-info-circle"></i> Jül Sezar'ın M.Ö. 49'da ordusuyla Rubicon nehrini geçerken söylediği rivayet edilir.
                        </div>
                    </div>
                </div>
            </div>
            -->
        </div>
    </main>

    <footer>
        <p>Latince Öğreniyorum Sözlüğü & Arşivi</p>
    </footer>

    <!-- Yeni JS dosyasını bağlayacağımız alan -->
    <script src="app.js"></script>
</body>
</html>
